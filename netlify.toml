[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Einzelseite - alle Pfade landen auf index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

# Der Service Worker darf nie aus dem Cache kommen, sonst bleibt eine alte
# Version der App auf dem Geraet haengen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
